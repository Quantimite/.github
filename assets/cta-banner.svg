<svg width="100%" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepViolet" x1="0" y1="0" x2="1200" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#190934"/>
      <stop offset="50%" stop-color="#281052"/>
      <stop offset="100%" stop-color="#150B2E"/>
    </linearGradient>
    <linearGradient id="pillBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <style>
    .pulse-ring {
      animation: pulseOp 2.8s ease-in-out infinite;
    }
    @keyframes pulseOp {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }
  </style>

  <rect width="1200" height="120" rx="14" fill="url(#deepViolet)"/>
  <rect x="0.5" y="0.5" width="1199" height="119" rx="13.5" stroke="#4C1D95" stroke-width="1"/>

  <text x="56" y="54" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Architecting the digital frontier.</text>
  <text x="56" y="82" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Full-stack precision  •  Enterprise quality  •  Designed to feel premium</text>

  <!-- Right Status Pill -->
  <rect x="930" y="40" width="214" height="40" rx="20" fill="url(#pillBtn)"/>
  <circle class="pulse-ring" cx="956" cy="60" r="5" fill="#FFFFFF"/>
  <text x="1046" y="65" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">QUANTIMITE.COM</text>
</svg>
