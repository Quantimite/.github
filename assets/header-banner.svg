@'
<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#090D16"/>
            <stop offset="50%" stop-color="#111629"/>
            <stop offset="100%" stop-color="#090D16"/>
        </linearGradient>
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A020F0"/>
            <stop offset="50%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        </pattern>
    </defs>

    <style>
    .pulse-line {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: dash 3.5s ease-in-out infinite alternate;
    }
    .float-slow {
      animation: float 4s ease-in-out infinite;
    }
    .fade-in {
      animation: fadeIn 1.2s ease-out forwards;
    }
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    </style>

    <rect width="1200" height="240" rx="0" fill="url(#bgGrad)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#brandGrad)"/>
    <rect x="0" y="237" width="1200" height="3" fill="url(#brandGrad)"/>

    <path class="pulse-line" d="M 40 190 L 180 190 L 220 150 L 360 150" stroke="url(#brandGrad)" stroke-width="2" opacity="0.6"/>
    <path class="pulse-line" d="M 1160 50 L 1020 50 L 980 90 L 840 90" stroke="url(#brandGrad)" stroke-width="2" opacity="0.6"/>

    <g class="float-slow" transform="translate(130, 68)" filter="url(#glow)">
        <path d="M52 14 C28 14 10 32 10 56 C10 80 28 98 52 98 C64 98 75 93 83 85 L102 66 M82 66 L102 66 L102 86" stroke="url(#brandGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M52 28 C36 28 24 40 24 56 C24 72 36 84 52 84 C60 84 67 81 72 76 L92 56" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g class="fade-in">
        <text x="275" y="118" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="6">QUANTIMITE</text>
        <text x="278" y="156" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="4">WE ENGINEER YOUR NEXT MOVE.</text>

        <rect x="278" y="176" width="110" height="24" rx="2" fill="rgba(160, 32, 240, 0.15)" stroke="#A020F0" stroke-width="1"/>
        <text x="333" y="192" text-anchor="middle" fill="#E9D5FF" font-family="monospace" font-size="11" font-weight="bold">SOFTWARE</text>

        <rect x="398" y="176" width="90" height="24" rx="2" fill="rgba(99, 102, 241, 0.15)" stroke="#6366F1" stroke-width="1"/>
        <text x="443" y="192" text-anchor="middle" fill="#C7D2FE" font-family="monospace" font-size="11" font-weight="bold">DESIGN</text>

        <rect x="498" y="176" width="135" height="24" rx="2" fill="rgba(37, 99, 235, 0.15)" stroke="#2563EB" stroke-width="1"/>
        <text x="565" y="192" text-anchor="middle" fill="#BFDBFE" font-family="monospace" font-size="11" font-weight="bold">DIGITAL GROWTH</text>
    </g>
</svg>
'@ | Set-Content -Path "assets\header-banner.svg" -Encoding UTF8